name: Deploy MatchPoint a EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    name: Construir y publicar ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [users, matchpoint]
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Calcular el nombre del paquete
        id: prep
        run: echo "prefix=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.prep.outputs.prefix }}/${{ matrix.service }}:latest
            ${{ steps.prep.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Actualizar el stack en la instancia
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Conectar a EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ubuntu/ae_2026_01_socasi_herrera_1473_match_point' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: APP_DIR,REGISTRY_USER,REGISTRY_TOKEN
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: no existe $APP_DIR/.env en la instancia."
              echo "Creelo una sola vez a partir de .env.example antes del primer despliegue."
              exit 1
            fi

            git fetch --prune origin
            git reset --hard origin/main

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            for intento in $(seq 1 24); do
              if curl -fsS http://localhost:9090/health > /dev/null; then
                echo "gateway respondiendo tras $intento intentos"
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: el gateway no respondio en 120 segundos."
            docker compose ps
            docker compose logs --tail=80
            exit 1
