name: matchpoint

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: matchpoint-nginx
    ports:
      - "${GATEWAY_PORT:-9090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      users:
        condition: service_started
      matchpoint:
        condition: service_started
      pgadmin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - backbone

  users:
    build: ./users
    container_name: matchpoint-users
    expose:
      - "8686"
    environment:
      SERVER_PORT: "8686"
      DB_URL: jdbc:postgresql://users-db:5432/${USERS_DB_NAME:-users_db}
      DB_USERNAME: ${USERS_DB_USER:-users_app}
      DB_PASSWORD: ${USERS_DB_PASSWORD:?falta USERS_DB_PASSWORD en el .env}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?falta COGNITO_USER_POOL_ID en el .env}
      COGNITO_ISSUER_URI: https://cognito-idp.${COGNITO_REGION:-us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID}
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8686/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - backbone

  users-db:
    image: postgres:16-alpine
    container_name: matchpoint-users-db
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_app}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?falta USERS_DB_PASSWORD en el .env}
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_app} -d ${USERS_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - users_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backbone

  matchpoint:
    build: ./matchpoint
    container_name: matchpoint-app
    expose:
      - "8787"
    environment:
      SERVER_PORT: "8787"
      SERVER_CONTEXT_PATH: /matchpoint
      DB_URL: jdbc:postgresql://matchpoint-db:5432/${MATCHPOINT_DB_NAME:-matchpoint_db}
      DB_USERNAME: ${MATCHPOINT_DB_USER:-matchpoint_app}
      DB_PASSWORD: ${MATCHPOINT_DB_PASSWORD:?falta MATCHPOINT_DB_PASSWORD en el .env}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?falta COGNITO_USER_POOL_ID en el .env}
      COGNITO_ISSUER_URI: https://cognito-idp.${COGNITO_REGION:-us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID}
      USERS_SERVICE_URL: http://users:8686
    depends_on:
      matchpoint-db:
        condition: service_healthy
      users:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/matchpoint/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - backbone

  matchpoint-db:
    image: postgres:16-alpine
    container_name: matchpoint-matchpoint-db
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${MATCHPOINT_DB_NAME:-matchpoint_db}
      POSTGRES_USER: ${MATCHPOINT_DB_USER:-matchpoint_app}
      POSTGRES_PASSWORD: ${MATCHPOINT_DB_PASSWORD:?falta MATCHPOINT_DB_PASSWORD en el .env}
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATCHPOINT_DB_USER:-matchpoint_app} -d ${MATCHPOINT_DB_NAME:-matchpoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - matchpoint_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backbone

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: matchpoint-pgadmin
    expose:
      - "80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@puce.edu.ec}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?falta PGADMIN_PASSWORD en el .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_LISTEN_PORT: "80"
      SCRIPT_NAME: /pgadmin
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      users-db:
        condition: service_healthy
      matchpoint-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/pgadmin/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - backbone

networks:
  backbone:
    driver: bridge

volumes:
  users_data:
  matchpoint_data:
  pgadmin_data: