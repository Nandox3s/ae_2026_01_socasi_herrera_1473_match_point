worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log de acceso alineado con el estandar de logging del proyecto: una sola linea,
    # campos separados por " | ". nginx no descifra el token, asi que su sub es siempre
    # "anonimo"; el sub real aparece en las lineas de cada microservicio.
    log_format matchpoint '$time_iso8601 | INFO  | nginx | sub=anonimo | access | '
                          'event=http.proxied | msg=$status $request_method $request_uri | '
                          'upstream=$upstream_addr duration=$request_time';

    # Todo a stdout/stderr, que es lo que captura docker compose logs -f.
    access_log /dev/stdout matchpoint;
    error_log  /dev/stderr warn;

    # DNS interno de Docker: los upstreams se resuelven por NOMBRE DE SERVICIO.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream users_backend {
        server users:8686;
        keepalive 16;
    }

    upstream matchpoint_backend {
        server matchpoint:8787;
        keepalive 16;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
    }

    # Timeouts explicitos: si un microservicio tarda, se corta y se responde 504
    # en vez de dejar la conexion colgada.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    send_timeout          30s;

    server {
        listen 80;
        server_name _;

        # Microservicio de usuarios.
        location /users {
            proxy_pass http://users_backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # Microservicio del proyecto (reservas + torneos).
        location /matchpoint {
            proxy_pass http://matchpoint_backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # Explorador de base de datos. Pasa por el proxy para que nginx siga siendo
        # el UNICO servicio con puerto publicado. pgAdmin ya se sirve a si mismo bajo
        # /pgadmin (SCRIPT_NAME), asi que aqui NO se reescribe el prefijo.
        location /pgadmin {
            proxy_set_header X-Script-Name /pgadmin;
            proxy_pass http://pgadmin_backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # Sonda del healthcheck del propio gateway.
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            default_type text/plain;
            return 200 "MatchPoint gateway -> /users | /matchpoint | /pgadmin\n";
        }
    }
}
